<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1300px;height:1750px;background:#050404;display:flex;flex-direction:column;
       align-items:center;padding:150px 110px 120px;position:relative;overflow:hidden;
       -webkit-font-smoothing:antialiased}
  body::before{content:"";position:absolute;inset:0;
    background:radial-gradient(1000px 640px at 50% 104%, rgba(201,162,39,.13), transparent 60%),
               radial-gradient(800px 480px at 50% -6%, rgba(201,162,39,.045), transparent 55%);}
  .k{font:500 26px "IBM Plex Mono";color:#c9a227;letter-spacing:.4em;text-indent:.4em;
     text-transform:uppercase;z-index:1;text-align:center}
  .t{font:400 92px/1.1 "Cormorant Garamond";color:#e8e4d9;margin-top:30px;z-index:1;text-align:center}
  .rule{width:420px;height:1px;margin-top:44px;z-index:1;
        background:linear-gradient(90deg,transparent,#8a6d1b,transparent)}
  .emblem{flex:1;width:100%;display:flex;align-items:center;justify-content:center;z-index:1}
  .cap{font:400 24px/1.7 "IBM Plex Mono";color:#8b8578;letter-spacing:.14em;z-index:1;
       text-align:center;max-width:900px}
  .cap i{color:#c9a227;font-style:normal}
  .sig{font:300 34px "Cormorant Garamond";color:#c9a227;letter-spacing:.35em;text-indent:.35em;
       margin-top:40px;z-index:1}
</style></head>
<body>
  <div class="k">record iv</div>
  <div class="t">The Watchtower</div>
  <div class="rule"></div>
  <div class="emblem">
   <svg width="880" height="600" viewBox="0 0 880 600">
     <line x1="120" y1="60" x2="120" y2="560" stroke="#6b6b6b" stroke-width="2"/>
     <rect x="96" y="34" width="48" height="34" fill="none" stroke="#c9a227" stroke-width="2"/>
     <circle cx="120" cy="51" r="6" fill="#c9a227">
     </circle>
     <line x1="120" y1="560" x2="860" y2="560" stroke="#6b6b6b" stroke-width="1.4" opacity=".7"/>
     <rect x="300" y="80" width="80" height="480" fill="rgba(139,133,120,.13)"/>
     <rect x="760" y="80" width="86" height="480" fill="rgba(139,133,120,.08)"/>
     <path d="M 140 480 L 200 420 L 250 398 L 290 405 L 330 452 L 360 440 L 420 400 L 520 392 L 620 344 L 700 300 L 760 330 L 800 345 L 840 330 L 860 318"
           fill="none" stroke="#c9a227" stroke-width="3.5"/>
     <path d="M 140 485 L 250 482 L 300 520 L 335 545 L 420 452 L 520 380 L 560 396 L 620 362 L 700 318 L 760 318 L 800 308 L 840 326 L 860 334"
           fill="none" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="7 6"/>

     <text x="766" y="106" fill="#6b6b6b" font-family="IBM Plex Mono" font-size="17">second</text>
     <text x="856" y="296" fill="#c9a227" font-family="IBM Plex Mono" font-size="20" text-anchor="end">the doctrine</text>
     <text x="856" y="372" fill="#6b6b6b" font-family="IBM Plex Mono" font-size="20" text-anchor="end">the index</text>
   </svg></div>
  <div class="cap">the score kept in public, day by day<br>ahead or behind · the line that refuses to die</div>
  <div class="sig">◊ ◈ ◊</div>
</body></html>
